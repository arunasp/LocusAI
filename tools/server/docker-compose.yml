# Do NOT run `docker compose`/`docker-compose` directly against this file.
# Always go through tools/server/start.sh (or tools/pipeline.sh server) --
# it does two things a raw `up -d` skips: (1) resolves and exports
# PROJECT_DIR so the volume mount isn't empty, and (2) `compose rm -sf`
# before `up -d` to clear the existing container first. Recreating an
# existing container in place hits docker-compose v1's `KeyError:
# 'ContainerConfig'` bug (docker/compose#11742) whenever the image was
# rebuilt with BuildKit -- confirmed recurring live when this file was
# invoked directly instead of through start.sh.
services:
  local-bash:
    build: .
    image: local-dev-tools
    command: ["python3", "/app/bash_mcp_server.py"]
    environment:
      MCP_PORT: "1443"
      # Run the server as the invoking host user rather than root, so
      # anything built here -- build/liblocus.so, build/gpu_probe,
      # core/.venv -- is owned by that user on the bind mount instead
      # of by root. entrypoint.sh creates the passwd entry and drops
      # privilege; see the ulimits block below for the second, separate
      # cause that must be fixed alongside it.
      TARGET_UID: ${TARGET_UID:-1000}
      TARGET_GID: ${TARGET_GID:-1000}
      # GPU access. /opt/rocm and /usr/lib/wsl are bind-mounted from the
      # host (below) rather than installed, so both must be on the
      # loader path. Verified live on this host: with these three
      # mounts plus libelf1/libnuma1/libdrm2 in the image, rocminfo
      # reports Agent 2 = gfx1100 / Radeon RX 7900 XT, 84 CUs.
      LD_LIBRARY_PATH: /opt/rocm/lib:/usr/lib/wsl/lib
      # /opt/rocm/bin prepended to the image's own default PATH. The
      # allowlist check in bash_mcp_server.py resolves a binary via
      # PATH, so ROCm tools mounted from the host are "allowlisted but
      # not installed" without this -- confirmed live. The rest of the
      # value is python:3.12-slim's own default, reproduced verbatim
      # rather than guessed, so nothing already on it is lost.
      PATH: /opt/rocm/bin:/usr/local/bin:/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    devices:
      # WSL2's GPU device node. Mode is crw-rw-rw- on the host, so no
      # group membership or --privileged is needed. This is the only
      # container in the project with device access -- cicd_runner's
      # workers deliberately have none, which is why GPU work belongs
      # here and CI work belongs there.
      - /dev/dxg:/dev/dxg
    ulimits:
      # Independent of the passwd entry entrypoint.sh creates, and both
      # are needed: after a set*uid() call the kernel checks the NEW real
      # uid's RLIMIT_NPROC, which is enforced per-uid SYSTEM-WIDE -- it
      # counts every process already running as that uid on the host, not
      # just those in this container. Docker's default can be as low as
      # 128, which an ordinary desktop session for uid 1000 exceeds on its
      # own, and the symptom is an EAGAIN on execve for any binary, which
      # reads like a permissions fault rather than a limit.
      nproc:
        soft: 8192
        hard: 8192
    ports:
      # Bound to 127.0.0.1 explicitly, not 0.0.0.0 -- WSL2's own
      # localhost-forwarding already keeps this off the LAN by
      # default, but binding explicitly is the correct belt-and-
      # braces choice rather than relying on that alone.
      - "127.0.0.1:1443:1443"
    volumes:
      - ${PROJECT_DIR}:/workspace
      # WSL's own GPU userspace: libdxcore.so and the D3D12 libs that
      # ROCm links against on WSL. Read-only, and the whole tree is
      # mounted rather than lib/ alone because the driver blobs under
      # drivers/ are resolved through it.
      - /usr/lib/wsl:/usr/lib/wsl:ro
      # The host's ROCm install, mounted rather than baked in. Keeps
      # the container's ROCm identical to the host's by construction,
      # and avoids a multi-GB layer. Read-only: nothing in here should
      # ever be written by this container.
      - /opt/rocm:/opt/rocm:ro
    restart: unless-stopped
